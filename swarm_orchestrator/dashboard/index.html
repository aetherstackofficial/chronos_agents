<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Chronos</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap">
<link rel="stylesheet" href="design-tokens.css">
<link rel="stylesheet" href="app-shell.css">
<link rel="stylesheet" href="theme-tv.css">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
</head>
<body>

<div id="ws-banner" class="ws-banner" role="status" hidden>
  <span class="spinner" aria-hidden="true"></span>
  <span>Connection lost — reconnecting to the engine…</span>
</div>

<header id="topbar" class="topbar">
  <a class="brand" href="#/market" aria-label="Chronos — main page"><svg class="brand-logo" viewBox="320 575 1292 468" aria-hidden="true"><path d="M320 575 L822 575 L822 747 L693 747 L693 705 L449 705 L449 914 L822 914 L822 1043 L320 1043 Z" fill="currentColor"/><circle cx="957" cy="802" r="93" fill="currentColor"/><polygon points="1233,575 1377,575 1157,1043 1013,1043" fill="currentColor"/><polygon points="1467,575 1612,575 1392,1043 1249,1043" fill="currentColor"/></svg><span class="brand-name">CHRONOS</span></a>

  <div class="topbar-status" aria-label="Market status">
    <span id="tb-sym" class="tb-sym" hidden>—</span>
    <span id="tb-price" class="tb-price mono" hidden>—</span>
    <span id="tb-mode" class="tb-state" hidden><span class="dot" aria-hidden="true"></span><span id="tb-mode-text">—</span></span>
    <span id="tb-day" class="tb-stat" hidden title="Date of the market data being played"><b id="tb-day-n">—</b></span>
    <span id="tb-clock" class="tb-stat mono" hidden>—</span>
  </div>

  <div class="topbar-controls" role="group" aria-label="Market controls">
    <button type="button" id="tb-pause" class="btn btn-sm" hidden>Pause</button>
    <div class="tb-menu-wrap">
      <button type="button" id="tb-stop" class="btn btn-sm" aria-haspopup="menu" aria-expanded="false" hidden>Stop</button>
      <div id="tb-stop-menu" class="tb-menu" role="menu" hidden>
        <button type="button" role="menuitem" data-act="stop"><b>Stop the market</b><span>Freeze it here. The chart, order book and trades stay on screen.</span></button>
        <button type="button" role="menuitem" data-act="new"><b>New run</b><span>Freeze it here and choose the data for the next run.</span></button>
      </div>
    </div>
    <button type="button" id="tb-pop" class="btn btn-ghost btn-icon" aria-label="Pop out current view data" title="Pop out" hidden></button>
    <span id="tb-conn" class="conn-dot" role="status" aria-label="Engine connection: connecting"></span>
  </div>
</header>

<div id="shell" class="shell">
  <nav id="nav" class="nav-rail" aria-label="Views"></nav>
  <main id="center" class="center-mount"></main>
  <aside id="rhs" class="rhs-panel" aria-label="Actions and live context"></aside>
</div>

<button type="button" id="rhs-reopen" class="rhs-reopen" aria-label="Reopen side panel" hidden>⟨</button>

<div id="toasts" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
