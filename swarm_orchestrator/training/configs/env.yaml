# ReplayBookEnv configuration. Every number the environment uses lives here.
# Read by training/envs/config.py. Override single keys in code with
# load_env_config(overrides={"rewards": {"whale": {"w_dd": 2.0}}}).

costs:
  # Round trip INTRADAY cost in bps of one-leg notional. null = read it from
  # validation/config/thresholds.yaml (a8_no_free_lunch.cost_bps_zero_brokerage = 3.55).
  # Each fill pays half of it: (rt/2) x notional x cost_mult.
  intraday_rt_bps: null
  # Round trip DELIVERY cost in bps. UNVERIFIED estimate: STT 0.1% on both sides
  # (20 bps) + stamp duty + exchange/SEBI/GST. Shares still held at a session
  # close pay (delivery_rt_bps - intraday_rt_bps) x value once (see CarryTracker).
  delivery_rt_bps: 22.0
  # Per-episode multiplier on every cost, drawn U[lo, hi] (cost robustness).
  cost_mult_range: [0.5, 1.5]

sampler:
  # Episode length in sessions, inclusive integer range per model.
  length_sessions:
    whale_swing: [1, 5]
    whale_position: [5, 20]
    mm: [1, 5]
  # Memory length M in sessions: [probability, lo, hi] buckets, M ~ U{lo..hi}.
  # Clamped to the sessions available before the warm-up session.
  memory_mix:
    - [0.05, 0, 0]        # no memory at all (cold start, like a fresh listing)
    - [0.20, 1, 19]       # short memory
    - [0.25, 20, 119]     # medium
    - [0.50, 120, 250]    # up to one year (MarketMemory max_days = 250)
  # Capacity decision A: sizes are a share of the stock's OWN average daily
  # volume over the ADV20 sessions before the episode start; log-uniform draw.
  adv_sessions: 20
  whale_capacity_adv_frac: [0.0005, 0.03]    # 0.05% .. 3% of ADV20 (max position, shares)
  mm_capacity_adv_frac: [0.0002, 0.005]      # 0.02% .. 0.5% of ADV20 (max inventory, shares)
  mm_quote_divisor: 5                        # max_quote_size = capacity / 5
  mm_capital_multiple: 2.0                   # MM capital = 2 x capacity x start price (whale: 1 x)
  # Whale risk tolerance (drawdown scale of the penalty), uniform. Same range as
  # features_v2 RISK_LO..RISK_HI so risk_appetite maps onto [0, 1].
  risk_tolerance_range: [0.03, 0.15]
  # Matching delay: 0 = orders go in before the next tick, 1 = after it. Chosen 50/50.
  order_delay_choices: [0, 1]
  # SIM_LP quote size multiplier (scales engine.LP_BASE_SIZE and LP_VOLUME_FACTOR on
  # the engine INSTANCE; the engine class is untouched), drawn U[lo, hi].
  lp_size_range: [0.5, 1.5]

env:
  # Gaussian noise std added to the market / memory / time inputs of the
  # observation (never to own-state, last-action, sector, whale-only inputs).
  # "absolute": x + N(0, std). WARNING: raw market inputs such as vwap_dist,
  # bar_range, ret_1m have typical size 1e-3, so 0.01 absolute noise buries them.
  # "relative": x * (1 + N(0, std)) keeps their scale (inputs at 0 stay 0).
  # Relative 5%: absolute 0.01 buried the 1e-3-sized market inputs (measured).
  obs_noise: 0.05
  obs_noise_mode: relative
  # Drawdown termination (fraction of the 5-session equity peak).
  dd_terminate:
    whale_swing: 0.30
    whale_position: 0.30
    mm: 0.50
  # Minutes between two decisions of the policy (one env step = this many 1-minute bars).
  # Between decisions the PovSlicer keeps working the last target (no new decode); fills,
  # fees, the drawdown stop and the reward (the DSR keeps per-minute returns, the step reward
  # is their sum) are still handled minute by minute. WHY: with a decision every minute all
  # three algorithms (round 1: TD3/SAC/PPO) churned - 5-7 full position flips per 5-session
  # episode, holding < 0.4 sessions - and lost 1.2-1.5% per episode, almost all of it
  # execution / market impact, not fees; one minute of reward is far too small against noise
  # for credit assignment. 15 min = ~25 decisions per session (swing), 75 min = 5 per session
  # (position), mm keeps quoting every minute. The last step of an episode may be shorter.
  # train.py turns the per-minute gamma of the run config into gamma ** K per decision.
  decision_minutes: {whale_swing: 15, whale_position: 75, mm: 1}
  # An episode is closed out at its last bar: cost of that exit =
  # |pos| x price x (intraday_rt/2 + half the spread in bps) x cost_mult.
  # (The cost multiplier of the episode applies to the whole expression, spread part included.)
  # close_at_end: false = no forced exit at the last bar (the episode end is an accounting cut:
  # the position is valued at the last price, as a fund marks its book to market). For the
  # position trader, whose holding period is longer than an episode. A drawdown stop still exits.
  close_at_end: true

rewards:
  whale:
    # profit term: "dsr" = differential Sharpe ratio (Moody & Saffell 2001),
    # "pnl" = pnl_scale x after-cost per-minute return (fallback).
    profit_term: dsr
    # DSR adaptation rate: 1/375 = a one-session memory for the swing whale,
    # 1/3750 = ten sessions for the position whale.
    eta: {whale_swing: 0.0026666667, whale_position: 0.00026666667}
    # Variance floor on B - A^2 (and initial B): (1 bp per minute)^2. Without it a flat
    # whale (R = 0) drives B to 0 and the next move gives D = huge.
    dsr_var_floor: 1.0e-8
    dsr_clip: 10.0           # D_t is clipped to +-10; the env reports how often.
    # pnl fallback: reward = pnl_scale x R_t. A full-capacity whale moves ~1e-3 per
    # minute, so 10 puts a step at ~1e-2, the size of a DSR step in a volatile minute.
    pnl_scale: 10.0
    # Drawdown penalty: w_dd x (max(0, dd - dd_free) / risk_tolerance)^2 per step.
    w_dd: 1.0
    dd_free: 0.05            # drawdowns below 5% of the 5-session peak are free
    # Multiplier applied on top of w_dd, per model. A DSR step is ~eta*z, so with
    # 1.0 an active penalty dominated it by ~100x (measured on random episodes).
    # Set to eta: at (dd - dd_free) = risk_tolerance the penalty equals a typical
    # DSR step, and it grows quadratically beyond that.
    dd_step_scale: {whale_swing: 0.0026666667, whale_position: 0.00026666667}
    w_term: 1.0              # paid once on the step where dd >= dd_terminate
    w_flat: 0.0              # inaction nudge: -w_flat per step while |pos| < flat_fraction x capacity
    flat_fraction: 0.05      # same "flat" threshold as agents/action_decode whale_flat_fraction
    # Switching penalty ("switch" reward part). Paid on every decision whose new target differs
    # from the current position: w_switch x |target - position| / capacity, in the same units as
    # the DSR step (it is added to the step reward as is). 0 = off; experiments set it through
    # env_overrides.
    w_switch: {whale_swing: 0.0, whale_position: 0.0}
  mm:
    # All MM parts are divided by capital, then multiplied by reward_scale.
    # 1e4 = the reward is in basis points of capital per step.
    reward_scale: 10000.0
    # Inventory penalty (money units, then / capital):
    #   w_inv x inv_penalty_ticks x tick x max_quote_size x (pos/capacity)^2 x (1 + max(0, -sign(pos) x ofi))
    # inv_penalty_ticks x w_inv = 1.0: a FULL-capacity inventory (pos = capacity) costs one
    # tick of spread on max_quote_size per minute, which is what a fully quoted
    # side earns when its quote is hit once. 20 x 0.05 = 1.
    w_inv: 0.05
    inv_penalty_ticks: 20.0
    # Uptime bonus when both sides are quoted, in units of (tick x max_quote_size) / capital.
    # Sizing: a quoter on the touch with half-size quotes gets ~1.3 fills per minute; the
    # spread it would earn if every fill kept its half spread (~1 tick, half size 0.5 x
    # max_quote_size) is about 1.3 x 0.5 x 1 = 0.65 units per minute, so 10% = ~0.065.
    # Rounded to 0.05. (The MEASURED gross markout of random / touch quoting is negative,
    # see the report: adverse selection plus 1.8 bps of fee per fill.)
    w_up: 0.05
    w_term: 100.0            # paid once at the dd >= 0.50 stop, in scaled (bps) units
