# Final overnight run 2026-11-06/07: whale_position PPO fine-tuned from a behaviour-cloning warm start
# (teacher: EMA20/60 trend rule). DSR reward, lr 1e-4, start std exp(-1.5)=0.22, 3 envs.
# steps / eval_every / checkpoint_every are DECISIONS (env steps), see the base config.
model: whale_position
algo: ppo
steps: 130000
n_envs: 3
eval_every: 2500
eval_episodes: 10
eval_env_overrides:
  sampler:
    length_sessions:
      whale_position:
      - 5
      - 5
checkpoint_every: 10000
frame_stack: 1
gamma: 0.9995
net_arch:
- 256
- 256
env_overrides: {}
algo_kwargs:
  learning_rate: 0.0001
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gae_lambda: 0.95
  clip_range: 0.2
log_std_init: -1.0
init_log_std: -1.5
