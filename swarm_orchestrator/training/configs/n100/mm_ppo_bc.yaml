# Round 2 (NIFTY-100, 102 stocks): mm PPO fine-tuned from behaviour cloning of the Avellaneda-Stoikov rule,
# with a 6x larger two-sided quoting bonus (w_up 0.30) so that quoting one side is not the easy optimum.
model: mm
algo: ppo
steps: 2000000
n_envs: 3
eval_every: 100000
eval_episodes: 10
eval_env_overrides:
  sampler:
    length_sessions:
      mm: [5, 5]
checkpoint_every: 200000
frame_stack: 1
gamma: 0.99
net_arch: [256, 256]
env_overrides:
  rewards:
    mm:
      w_up: 0.30
obs_scaler: obs_scaler_mm_n100.json
algo_kwargs:
  learning_rate: 0.0001
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gae_lambda: 0.95
  clip_range: 0.2
log_std_init: -1.0
init_log_std: -2.0
