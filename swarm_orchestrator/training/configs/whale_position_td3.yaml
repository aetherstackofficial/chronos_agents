# whale_position / td3: training config (training.train --model whale_position --algo td3)
# NOTE: steps / eval_every / checkpoint_every count env steps = DECISIONS. One env step is
# env.decision_minutes[whale_position] = 75 minutes (training/configs/env.yaml), so they are the old
# per-minute numbers (1_000_000 / 250_000 / 250_000) divided by 75: the same minutes of market per run.
# gamma below is per MINUTE; train.py uses gamma ** 75 per decision (algorithm and VecNormalize).
model: whale_position
algo: td3
steps: 13333               # decisions (was 1_000_000 minutes)
n_envs: 8
eval_every: 3333            # decisions (env steps, summed over all envs) between validation evals
eval_episodes: 10
eval_env_overrides:         # merged into env.yaml for the eval env only
  sampler:
    length_sessions:
      whale_position: [5, 5]            # eval episodes of exactly 5 sessions
checkpoint_every: 3333       # decisions
frame_stack: 1
gamma: 0.9995
net_arch: [256, 256]
env_overrides: {}           # merged into training/configs/env.yaml (both train and eval env)
algo_kwargs:
  learning_rate: 0.001
  buffer_size: 1000000
  batch_size: 256
  action_noise_sigma: 0.1
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  train_freq: 1
  gradient_steps: 4
